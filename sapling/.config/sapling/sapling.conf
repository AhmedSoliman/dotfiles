[ui]
username = Ahmed Farghal <me@asoli.dev>

# uncomment to disable color in command output
# (see 'sl help color' for details)
# color = never

# uncomment to disable command output pagination
# (see 'sl help pager' for details)
# paginate = never
merge = :merge

[alias]
d = !$HG diff $@ | hunk pager
s = !$HG show $@ | hunk pager
main = goto remote/main
submit-stack = !sl-submit-stack "$@"
# Bundle the whole draft stack under top() (so it works from any commit in the
# stack) into a git bundle for another machine. Usage: sl bundle-stack [FILE]
# (default: stack.bundle). Apply it there with
# `sl pull && sl unbundle FILE && sl goto <top>`. --base is always given so sl
# doesn't try to compute it by talking to GitHub over the hg ssh protocol.
# Note: sl replaces "$1" (double-quoted) with nothing, hence the single quotes.
bundle-stack = !f='$1'; f="${f:-stack.bundle}"; $HG bundle -r 'top()' --base remote/main "$f" && echo "wrote $f. on the other machine: sl pull && sl unbundle $f && sl goto $($HG log -r 'top()' -T '{node|short}')"
bundle-stack:doc = bundle the current draft stack (remote/main::top()) into FILE (default: stack.bundle) for another machine
# Per-repo watchman tuning: skip cargo's target/ so recrawls stay cheap. Writes
# .watchmanconfig (shows as untracked) and re-watches the root so it applies now.
watchman-ignore-target = !r=$($HG root) && printf '{\n  "ignore_dirs": ["target"]\n}\n' > "$r/.watchmanconfig" && watchman watch-del "$r" >/dev/null 2>&1; watchman watch-project "$r" >/dev/null && echo "watchman ignoring $r/target"

[fsmonitor]
mode = on

[hint]
ack = smartlog-default-command

[github]
# Give each commit its own PR diff by basing it on the preceding commit's PR
# branch. This is also the branch topology expected by GitHub Stacked PRs.
pr-workflow = single

# GitHub's native stack UI replaces the ReviewStack link Sapling otherwise
# adds to every pull request body.
pull-request-include-reviewstack = false


[isl]
hasShownGettingStarted = true
render-compact = false
show-diff-number = false

[signing]
backend = ssh
key = ~/.ssh/id_ed25519_github
